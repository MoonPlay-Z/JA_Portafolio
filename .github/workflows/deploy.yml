name: CI – Lint, Typecheck, Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: ✅ Validar integración
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Typecheck
        run: npx tsc --noEmit

      - name: ✅ Tests
        run: npm test

      - name: 🏗️ Build production
        run: npm run build
        env:
          NODE_ENV: production
