name: CI – Lint, Build & Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Lint + Build
  # ────────────────────────────────────────────────────────────
  build:
    name: 🔨 Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run lint (oxlint)
        run: npm run lint

      - name: 🏗️ Build production bundle
        run: npm run build
        env:
          # Agregar variables de entorno de Supabase si se usan en el futuro:
          # VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      - name: 📤 Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Job 2: Validate build output (solo en push a main)
  # ────────────────────────────────────────────────────────────
  validate:
    name: ✅ Validate Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: ⬇️ Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: 🔎 Verify index.html exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ ERROR: dist/index.html not found!"
            exit 1
          fi
          echo "✅ index.html found"

      - name: 🗺️ Verify sitemap.xml exists
        run: |
          if [ ! -f dist/sitemap.xml ]; then
            echo "❌ ERROR: dist/sitemap.xml not found!"
            exit 1
          fi
          echo "✅ sitemap.xml found"

      - name: 🤖 Verify robots.txt exists
        run: |
          if [ ! -f dist/robots.txt ]; then
            echo "❌ ERROR: dist/robots.txt not found!"
            exit 1
          fi
          echo "✅ robots.txt found"

      - name: 📊 Report bundle size
        run: |
          echo "📦 Build output sizes:"
          du -sh dist/
          echo ""
          echo "📄 Asset files:"
          find dist/assets -name "*.js" -o -name "*.css" | xargs du -sh 2>/dev/null | sort -h
