# ============================================================
# netlify.toml — Configuración de despliegue para Netlify
# Portafolio: Juan Arcila | juanarcila.dev
# ============================================================

# -----------------------------------------------------------
# BUILD
# -----------------------------------------------------------
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# -----------------------------------------------------------
# SPA REDIRECT — React Router (client-side routing)
# -----------------------------------------------------------
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# -----------------------------------------------------------
# SECURITY HEADERS — aplicados a todas las rutas
# -----------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Previene clickjacking: no se puede embeber en iframes
    X-Frame-Options = "DENY"

    # Previene MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Controla qué referrer se envía al navegar
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Bloquea acceso a APIs del dispositivo no utilizadas
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Política de seguridad de contenido
    # Ajustada para Tailwind inline-styles y Google Fonts
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://netlify.app; form-action 'self';"

    # Fuerza HTTPS por 1 año (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Control XSS moderno (para navegadores heredados)
    X-XSS-Protection = "1; mode=block"

# -----------------------------------------------------------
# CACHE — Assets estáticos de Vite (hashed filenames)
# Vite genera nombres como: index-BxYzAb12.js → cache inmutable
# -----------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# -----------------------------------------------------------
# CACHE — Archivos HTML: nunca cachear
# -----------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# -----------------------------------------------------------
# CACHE — Archivos públicos estáticos (SVG, PDF, webmanifest)
# -----------------------------------------------------------
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Disposition = "inline"
